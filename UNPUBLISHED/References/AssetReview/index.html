<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprite library · Tales of Valora</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#14171d;color:#e7ebf2}*{box-sizing:border-box}body{margin:0}header{padding:24px 28px;background:#1c2029}h1{margin:0 0 8px;font-size:28px}p{color:#adb8ca;line-height:1.5}a{color:#a9d4ff}button,input,select{font:inherit;border:1px solid #505a6b;border-radius:7px;background:#262d39;color:inherit;padding:10px}button{cursor:pointer}button:hover{border-color:#9ac9ff}:focus-visible{outline:3px solid #91c7ff;outline-offset:3px}button:disabled{opacity:.35;cursor:default}.tools{position:sticky;top:0;background:#1c2029;z-index:2;padding:16px 28px;display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid #363c48}.tools input{flex:1;min-width:180px}.count{padding:12px 28px;margin:0}#gallery{padding:0 28px 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;background:#202630;border-color:#363c48}.art{display:flex;align-items:center;justify-content:center;width:100%;height:190px;background-color:#343b47;background-image:conic-gradient(#2a303b 25%,transparent 0 50%,#2a303b 0 75%,transparent 0);background-size:24px 24px}.art img{image-rendering:pixelated;object-fit:contain;max-width:100%;max-height:100%}.info{padding:14px;width:100%}.id{color:#a9d4ff;font-size:13px;font-weight:700}.name{display:block;overflow-wrap:anywhere;margin:7px 0;line-height:1.35;font-size:16px}.dims{color:#aebace;font-size:13px}.pages{display:flex;justify-content:center;align-items:center;gap:18px;padding:0 28px 32px}dialog{width:min(960px,95vw);max-height:94vh;overflow:auto;background:#1c2029;color:inherit;border:1px solid #66768f;border-radius:12px;padding:22px}dialog::backdrop{background:#080b12db}.detail-top{display:flex;justify-content:space-between;gap:16px;align-items:start}.detail-top h2{margin:5px 0 14px;overflow-wrap:anywhere;font-size:22px}#preview{height:360px;margin:8px 0 16px}#preview img{max-width:96%;max-height:96%}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}.path{overflow-wrap:anywhere;font-family:monospace;color:#bdcce2}#copyStatus{color:#add8b6}@media(max-width:600px){header,.tools{padding:18px}#gallery{padding:0 14px 20px;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.art{height:150px}.name{font-size:14px}.info{padding:10px}#preview{height:260px}}
</style>
<header><h1>Sprite library</h1><p>Click an image to enlarge it and copy its name and number. Search by name, number, or filename.</p><p>Tales of Valora · Private asset review · <a href="werewolves.html">Werewolf previews for Fenris</a></p></header>
<div class="tools"><input id="search" type="search" placeholder="Search sprites…" aria-label="Search sprites"><select id="sort" aria-label="Sort sprites"><option value="id">Sprite number</option><option value="name">Name A–Z</option><option value="size">Largest images first</option></select><button id="reset">Reset</button></div>
<p class="count" id="count" aria-live="polite"></p><main id="gallery"></main>
<nav class="pages" aria-label="Gallery pages"><button id="previous">Previous page</button><span id="pageLabel"></span><button id="next">Next page</button></nav>
<dialog id="detail"><div class="detail-top"><div><span class="id" id="detailId"></span><h2 id="detailName"></h2></div><button id="close">Close</button></div><div class="art" id="preview"><img id="detailImage" alt=""></div><p id="detailMeta"></p><p class="path" id="detailPath"></p><div class="actions"><button id="previousSprite">← Previous sprite</button><button id="nextSprite">Next sprite →</button><button id="copy">Copy reference</button><a id="original" target="_blank" rel="noopener">Open original PNG</a><span id="copyStatus" role="status"></span></div></dialog>
<script src="sprites-data.js"></script><script src="gallery.js"></script></html>
