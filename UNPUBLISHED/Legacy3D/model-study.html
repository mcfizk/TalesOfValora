<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fenris · Character preview</title><style>*{box-sizing:border-box}html,body{margin:0;background:#24272b;color:#e7dfcf;font:14px system-ui}canvas{display:block;touch-action:none}header{position:fixed;top:22px;left:26px;pointer-events:none}h1{font:32px Georgia;margin:0 0 5px}p{margin:0;color:#b3b2ac}nav{position:fixed;bottom:24px;left:0;right:0;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 12px}button,a{font:inherit;color:#e7dfcf;background:#252c2de6;border:1px solid #6d6c5a;padding:10px 15px;border-radius:4px;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#42483d}button:focus-visible,a:focus-visible{outline:2px solid #dbc684;outline-offset:3px}#status{position:fixed;top:50%;width:100%;text-align:center;pointer-events:none}</style></head><body><header><h1>Fenris</h1><p>Character preview · Drag to turn · Scroll to zoom</p></header><div id="status" role="status">Loading Fenris…</div><nav><button id="front">Front</button><button id="side">Side</button><button id="back">Back</button><button id="shape" aria-pressed="false">Show shape</button><button id="walk" aria-pressed="false">Walk</button><a href="../..">Enter the clearing</a></nav><script type="module">
import * as T from './vendor/three.module.js';import{createFenris}from'./character.js?v=3';import{loadVisualAssets}from'./visuals.js?v=3';
const clay=new URLSearchParams(location.search).has('clay'),renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#24272b');const camera=new T.PerspectiveCamera(33,innerWidth/innerHeight,.1,60);let zoom=innerWidth<700?12:9;camera.position.set(0,2.9,zoom);camera.lookAt(0,2.05,0);scene.add(new T.HemisphereLight('#f2eee6','#61616a',1.6));const light=new T.DirectionalLight('#fff0da',3);light.position.set(-3,7,5);light.castShadow=true;light.shadow.mapSize.set(1024,1024);scene.add(light);const rim=new T.DirectionalLight('#a6c7f0',2);rim.position.set(3,5,-3);scene.add(rim);const floor=new T.Mesh(new T.PlaneGeometry(40,40),new T.MeshStandardMaterial({color:'#36383a',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
let assets;try{assets=await loadVisualAssets();}catch(e){document.getElementById('status').textContent='Could not load Fenris. Reload to try again.';throw e;}const model=createFenris(assets,{clay});scene.add(model.root);document.getElementById('status').hidden=true;let walking=false,drag=null;window.modelReady=true;window.turnModel=a=>{model.root.rotation.y=a;};window.stepModel=t=>model.animate(.016,t,5,true,false);
for(const [id,a]of [['front',0],['side',-Math.PI/2],['back',Math.PI]])document.getElementById(id).onclick=()=>turnModel(a);const shape=document.getElementById('shape');shape.setAttribute('aria-pressed',String(clay));shape.textContent=clay?'Show coat':'Show shape';shape.onclick=()=>{location.search=clay?'':'?clay';};document.getElementById('walk').onclick=e=>{walking=!walking;e.currentTarget.setAttribute('aria-pressed',String(walking));e.currentTarget.textContent=walking?'Stand still':'Walk';};renderer.domElement.addEventListener('pointerdown',e=>{drag=e.clientX;renderer.domElement.setPointerCapture(e.pointerId);});renderer.domElement.addEventListener('pointermove',e=>{if(drag===null)return;model.root.rotation.y+=(e.clientX-drag)*.008;drag=e.clientX;});for(const event of ['pointerup','pointercancel'])renderer.domElement.addEventListener(event,()=>drag=null);renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zoom=T.MathUtils.clamp(zoom+e.deltaY*.008,6,15);camera.position.z=zoom;camera.lookAt(0,2.05,0);},{passive:false});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});const clock=new T.Clock();function render(){requestAnimationFrame(render);const dt=Math.min(clock.getDelta(),.05);model.animate(dt,clock.elapsedTime,5,walking,false);renderer.render(scene,camera);}render();
</script></body></html>
