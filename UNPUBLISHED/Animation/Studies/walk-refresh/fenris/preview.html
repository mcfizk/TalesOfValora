<!doctype html><meta charset="utf-8"><title>Fenris walk refresh</title><style>body{font:16px system-ui;background:#172831;color:#e8eeeb;margin:24px auto;max-width:1180px;padding:0 20px}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:9px}main{display:flex;gap:24px;flex-wrap:wrap;margin-top:20px}canvas{background:#20353f;image-rendering:pixelated;max-width:100%}a{color:#e3c58e}aside{max-width:560px}#thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}#thumbs canvas{width:125px;height:auto}h1{font:32px Georgia}</style><h1>Fenris — walk refresh</h1><p>Eight phases per second. Other actions are unchanged. Only completed directions appear below.</p><nav><select id="direction"></select><button id="play">Pause</button><button id="prev">Previous</button><button id="next">Next</button><label>Speed <input id="speed" type="range" min=".25" max="1.5" step=".25" value="1"></label><label><input type="checkbox" id="onion"> Previous pose</label></nav><main><canvas id="stage" width="512" height="640"></canvas><aside><h2 id="status"></h2><p id="phase"></p><div id="thumbs"></div><p><a id="gif">Animated GIF</a> · <a id="sheet">Sprite sheet</a></p></aside></main><script src="walks.js"></script><script>
const images={},roles=['Near contact','Near settle','Far passing','Far reach','Far contact','Far settle','Near passing','Near reach'];let t=0,last=performance.now(),playing=true,index=0;const direction=document.querySelector('#direction');for(const d of Object.keys(configs)){const o=document.createElement('option');o.value=d;o.textContent=d;direction.append(o);const im=new Image;im.src=configs[d].file;images[d]=im}const thumbs=[];for(let i=0;i<8;i++){const c=document.createElement('canvas');c.width=256;c.height=320;c.onclick=()=>seek(i);document.querySelector('#thumbs').append(c);thumbs.push(c)}function pose(c,im,i,w,h){c.imageSmoothingEnabled=false;c.drawImage(im,i%4*512,Math.floor(i/4)*640,512,640,0,0,w,h)}function draw(){index=Math.floor(t*8)%8;const d=direction.value,im=images[d],c=document.querySelector('#stage').getContext('2d');c.clearRect(0,0,512,640);c.strokeStyle='#617e87';c.beginPath();c.moveTo(0,610.5);c.lineTo(512,610.5);c.stroke();if(im.complete&&im.naturalWidth){if(document.querySelector('#onion').checked){c.globalAlpha=.18;pose(c,im,(index+7)%8,512,640);c.globalAlpha=1}pose(c,im,index,512,640);thumbs.forEach((cv,i)=>{const x=cv.getContext('2d');x.clearRect(0,0,256,320);pose(x,im,i,256,320);cv.style.outline=i===index?'2px solid #e3c58e':'none'})}document.querySelector('#status').textContent=d+' — '+(index+1)+' / 8';document.querySelector('#phase').textContent=roles[index];document.querySelector('#gif').href='walk-'+d+'.gif';document.querySelector('#sheet').href=configs[d].file}function seek(i){t=((i+8)%8)/8;playing=false;document.querySelector('#play').textContent='Play';draw()}document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};document.querySelector('#prev').onclick=()=>seek(index-1);document.querySelector('#next').onclick=()=>seek(index+1);direction.onchange=()=>{t=0;draw()};function tick(now){if(playing)t+=(now-last)/1000*Number(document.querySelector('#speed').value);last=now;draw();requestAnimationFrame(tick)}window.review={seek,get frame(){return index},get ready(){return Object.values(images).every(i=>i.complete&&i.naturalWidth)}};requestAnimationFrame(tick);</script>
