<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Walking revision — before and after</title>
<style>body{margin:24px auto;max-width:1000px;padding:0 20px;background:#17262f;color:#e9f0ed;font:16px system-ui}h1{font:32px Georgia}p,small{color:#b6cac9}nav{display:flex;gap:15px;align-items:center;flex-wrap:wrap;padding:16px;background:#2a3e47;border-radius:8px}button,select{font:inherit;padding:8px;background:#e2c89c;border:0;border-radius:5px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}section{background:#22353f;padding:16px;border-radius:10px}h2{font-size:19px;margin:0}canvas{display:block;width:100%;image-rendering:pixelated;background:#1d3039}a{color:#e2c89c}.status{min-height:24px}</style>
<h1>Walking revision</h1><p>Original walks on the left, the new rigged cycles on the right. Both play a complete cycle in one second. The revised cycles contain 16 distinct frames.</p><nav><select id="direction"></select><button id="play">Pause</button><button id="restart">Restart</button><button id="step">Step 1/16 second</button><label>Speed <input id="speed" type="range" min="0.25" max="1.5" step="0.25" value="1"></label></nav><main></main><p><a href="../index.html">Compare with Fenris and human bases →</a></p>
<script>
const ids=['dwarf-male','dwarf-female','halfling-male','halfling-female'],dirs=['left','right','up-left','up-right','up','down-left','down-right','down'],cards=[];let time=0,playing=true,last=performance.now();
for(const d of dirs){const o=document.createElement('option');o.value=d;o.textContent=d;document.querySelector('#direction').append(o)}
for(const id of ids)for(const revised of [false,true]){const el=document.createElement('section');el.innerHTML='<h2>'+id.replaceAll('-',' ')+'</h2><p>'+(revised?'Revised · 16 frames':'Original · 8 frames')+'</p><canvas width="480" height="480"></canvas><p class="status"></p>';document.querySelector('main').append(el);const images={};for(const dir of dirs){const im=new Image();im.src=(revised?'..':'originals/')+id+'/walk-'+dir+'.png';images[dir]=im}cards.push({id,revised,images,c:el.querySelector('canvas'),status:el.querySelector('.status')})}
function draw(){const dir=document.querySelector('#direction').value;for(const a of cards){const frames=a.revised?16:8,k=Math.floor(time*frames)%frames,im=a.images[dir],ctx=a.c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,480,480);ctx.strokeStyle='#667d82';ctx.beginPath();ctx.moveTo(0,440);ctx.lineTo(480,440);ctx.stroke();if(im.complete&&im.naturalWidth)ctx.drawImage(im,k%4*640,Math.floor(k/4)*640,640,640,0,-10,480,480);a.status.textContent='Frame '+(k+1)+' / '+frames;}}
function pause(){playing=false;document.querySelector('#play').textContent='Play'}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};document.querySelector('#step').onclick=()=>{pause();time+=1/16;draw()};document.querySelector('#restart').onclick=()=>{time=0;draw()};document.querySelector('#direction').onchange=()=>{time=0;draw()};
window.review={cards,setTime(v){time=v;pause();draw()},get ready(){return cards.every(a=>Object.values(a.images).every(im=>im.complete&&im.naturalWidth))}};
function tick(now){if(playing)time+=(now-last)/1000*Number(document.querySelector('#speed').value);last=now;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
