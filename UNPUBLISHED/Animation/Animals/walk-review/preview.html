<!doctype html><meta charset="utf-8"><title>Animal walks</title><style>body{background:#172831;color:#e8eeeb;font:16px system-ui;margin:24px}h1{font:32px Georgia}nav{display:flex;gap:12px;align-items:center}button,select{padding:8px;font:inherit}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:20px}section{background:#20353f;padding:14px;border-radius:8px}canvas{width:100%;image-rendering:pixelated}small{color:#bdced1}</style><h1>Animal movement review</h1><p>Stag, doe and wolf walks; hare hop. Left/right only.</p><nav><select id="direction"><option>left</option><option>right</option></select><button id="play">Pause</button><button id="prev">Previous</button><button id="next">Next</button><label>Speed <input id="speed" type="range" min=".25" max="1.5" step=".25" value="1"></label><span id="phase"></span></nav><main></main><p><small>Transparent sprite sheets and GIFs saved per animal. Review assets; no game changes.</small></p><script src="records.js"></script><script>
const cards=[];let t=0,playing=true,last=performance.now();for(const r of records){const el=document.createElement('section');el.innerHTML='<h2>'+({deer:'Stag',doe:'Doe',wolf:'Wolf',hare:'Hare'}[r.id])+'</h2><canvas width="480" height="560"></canvas>';document.querySelector('main').append(el);const images={};for(const d of ['left','right']){const im=new Image;im.src=r.id+'/'+r.files[d];images[d]=im}cards.push({r,images,canvas:el.querySelector('canvas')})}function draw(){const i=Math.floor(t*8)%8,d=document.querySelector('#direction').value;document.querySelector('#phase').textContent='Frame '+(i+1)+' / 8';for(const a of cards){const c=a.canvas.getContext('2d'),s=a.r,k=10*s.displayHeight/s.bodyHeight;c.imageSmoothingEnabled=false;c.clearRect(0,0,480,560);c.strokeStyle='#617e87';c.beginPath();c.moveTo(0,520);c.lineTo(480,520);c.stroke();const im=a.images[d];if(im.complete&&im.naturalWidth)c.drawImage(im,i%4*640,Math.floor(i/4)*640,640,640,240-320*k,520-600*k,640*k,640*k)}}function seek(i){t=((i+8)%8)/8;playing=false;document.querySelector('#play').textContent='Play';draw()}document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};document.querySelector('#next').onclick=()=>seek(Math.floor(t*8)%8+1);document.querySelector('#prev').onclick=()=>seek(Math.floor(t*8)%8-1);function tick(now){if(playing)t+=(now-last)/1000*Number(document.querySelector('#speed').value);last=now;draw();requestAnimationFrame(tick)}window.review={cards,seek,get frame(){return Math.floor(t*8)%8},get ready(){return cards.every(a=>Object.values(a.images).every(im=>im.complete&&im.naturalWidth))}};requestAnimationFrame(tick);
</script>
